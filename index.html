<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>GitROM Store</title><style>body{margin:0;background:#0b0d12;color:#fff;font:16px system-ui}header{padding:24px;background:#121621}h1{margin:0}main{max-width:1100px;margin:auto;padding:24px}#games{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:18px}.card{background:#171b27;border-radius:16px;overflow:hidden}.card img{width:100%;aspect-ratio:3/4;object-fit:cover;background:#222}.p{padding:14px}button{width:100%;padding:10px;border:0;border-radius:9px;background:#735cff;color:white;font-weight:700}#status{color:#aaa;margin-bottom:18px}</style></head><body><header><h1>🎮 GitROM Store</h1></header><main><div id='status'>Loading GitHub library…</div><div id='games'></div></main><script>
const grid=document.querySelector('#games'),status=document.querySelector('#status');
fetch('/api/games').then(r=>r.json()).then(data=>{if(data.error)throw Error(data.error);status.textContent=`${data.games.length} game(s)`;data.games.forEach(g=>{let d=document.createElement('div');d.className='card';d.innerHTML=`<img src="${g.cover}" alt=""><div class="p"><h3>${g.name}</h3><small>${g.format.toUpperCase()}</small><p><button>Play</button></p></div>`;d.querySelector('button').onclick=()=>{localStorage.setItem('lastGame',JSON.stringify(g));alert(`ROM ready: ${g.rom}\n\nConnect your preferred browser emulator core in player.html.`)};grid.appendChild(d)})}).catch(e=>status.textContent='Could not load games: '+e.message);
</script></body></html>
